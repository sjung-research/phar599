[project]
name = "gfap-conc"
version = "0.1.0"
description = "Quantitative analysis of a Mouse anti-GFAP primary-antibody concentration curve from Leica .lif confocal z-stacks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "scikit-image>=0.24",
    "tifffile>=2024.8.30",
    "liffile>=2025.1.1",
    "pyyaml>=6.0",
]

[project.scripts]
gfap-conc = "gfap_conc.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gfap_conc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
